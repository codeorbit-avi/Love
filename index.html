<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title> Will You Be My Valentine? ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    html, body { margin:0; padding:0; }

    .bg-cinematic {
      background: radial-gradient(circle at top, #fff0f5, #ff8fb1, #9c0028);
    }

    .rose {
      position: fixed;
      font-size: 88px; /* HUGE roses for full-screen coverage */ /* BIGGER roses */
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>

<body class="bg-cinematic text-white overflow-hidden">

<!-- 🎵 MUSIC -->
<audio id="bgMusic" loop volume="0.25">
  <source src="https://cdn.pixabay.com/download/audio/2023/02/28/audio_5b6c7c3e61.mp3" type="audio/mp3">
</audio>

<!-- 🌹 FULLSCREEN FLOWER LAYER -->
<div id="memeLayer" class="fixed inset-0 hidden flex items-center justify-center z-50">
  <div class="bg-[#800000] rounded-3xl p-6 shadow-2xl text-center">
    <video id="memeVideo" autoplay loop muted playsinline class="max-w-[90vw] max-h-[70vh] rounded-xl mx-auto shadow-xl">
      <source src="Memes_Download_for_YouTube.mp4" type="video/mp4" />
    </video>
    <p class="mt-4 text-2xl sm:text-3xl font-bold text-white">SHE SAID YES!!! ❤️🔥</p>
    <p class="mt-3 text-lg sm:text-xl text-rose-200 font-semibold">दिल ने तुझे चाहा है इबादत की तरह,<br/>हर पल रखा है तुझे अमानत की तरह।<br/>तू मिले या न मिले ये मुक़द्दर की बात है,<br/>हम तो तुझे चाहते हैं मोहब्बत की तरह। 🌹</p>
  </div>
</div>

<div id="flowerLayer" class="fixed inset-0 pointer-events-none z-40"></div>
<div id="flowerLayer" class="fixed inset-0 pointer-events-none z-50"></div>

<!-- 🏠 HOME / HERO -->
<section class="min-h-screen flex flex-col justify-center items-center text-center px-6">

  <h1 id="title" class="text-4xl sm:text-6xl md:text-8xl font-extrabold bg-gradient-to-r from-pink-400 to-red-500 bg-clip-text text-transparent mb-6">
 Will You Be My Valentine? 💖
  </h1>

  <p class="text-base sm:text-xl max-w-xl mb-10 text-gray-200">
    Today… tomorrow… and every heartbeat after this.
  </p>

  <div class="flex gap-6">
    <button onclick="yesValentine()" class="px-10 py-4 rounded-full bg-gradient-to-r from-pink-500 to-red-600 text-xl shadow-xl hover:scale-110 transition">
      YES 😍
    </button>

    <button id="noBtn" onclick="moveNo()" class="px-10 py-4 rounded-full bg-gray-600 text-xl shadow-xl hover:scale-105 transition">
      NO 🙈
    </button>
  </div>

</section>

<script>
  const music = document.getElementById('bgMusic');

  window.addEventListener('click', () => {
    music.play();
  }, { once:true });

  // NO button runs away 😏
  function moveNo() {
    const btn = document.getElementById('noBtn');
    btn.style.position = 'absolute';
    btn.style.left = Math.random() * 70 + '%';
    btn.style.top = Math.random() * 70 + '%';
  }

  // YES = flower takeover 🌹🌸💐
  function yesValentine() {
    // turn screen white instantly
    document.body.style.background = '#ffffff';
    document.body.classList.remove('bg-cinematic');

    blast();

    // show meme after roses
    setTimeout(showMeme, 2000);
  }

  function showMeme() {
    const meme = document.getElementById('memeLayer');
    meme.classList.remove('hidden');

    gsap.fromTo(meme,
      { scale: 0.3, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.8, ease: 'back.out(1.7)' }
    );
  }

  function blast() {
    const layer = document.getElementById('flowerLayer');
    const icons = ['🌹']; // roses only

    // clear any old flowers
    console.assert(layer, 'flowerLayer must exist');
    layer.innerHTML = '';

    const total = 700; // fill entire screen

    for (let i = 0; i < total; i++) {
      const el = document.createElement('div');
      el.className = 'rose';
      el.textContent = icons[Math.floor(Math.random() * icons.length)];

      el.style.left = Math.random() * 100 + '%';
      el.style.top = Math.random() * 100 + '%';
      el.style.opacity = Math.random() * 0.5 + 0.5;

      layer.appendChild(el);

      gsap.fromTo(
        el,
        { scale: 0.2, y: window.innerHeight },
        {
          y: -window.innerHeight,
          x: (Math.random() - 0.5) * 800,
          rotation: Math.random() * 720,
          duration: 4 + Math.random() * 2,
          ease: 'power2.out',
          onComplete: () => el.remove(),
        }
      );
    }

    // second wave so no empty space remains
    setTimeout(() => {
      for (let i = 0; i < 400; i++) {
        const el = document.createElement('div');
        el.className = 'rose';
        el.textContent = icons[Math.floor(Math.random() * icons.length)];

        el.style.left = Math.random() * 100 + '%';
        el.style.top = Math.random() * 100 + '%';

        layer.appendChild(el);

        gsap.fromTo(
          el,
          { scale: 0.3, y: window.innerHeight },
          {
            y: -window.innerHeight,
            rotation: Math.random() * 720,
            duration: 5,
            ease: 'power2.out',
            onComplete: () => el.remove(),
          }
        );
      }
    }, 1200);

    // pulse headline
    gsap.to('#title', { scale: 1.2, yoyo: true, repeat: 1, duration: 0.4 });
  }
</script>

</body>
</html>
